<script>
        // Micro-interaction: Canvas Particle Effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('main');
            for(let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.className = 'absolute pointer-events-none opacity-20';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.top = Math.random() * 100 + 'vh';
                petal.style.width = '10px';
                petal.style.height = '10px';
                petal.style.backgroundColor = i % 2 === 0 ? '#fed65b' : '#ab859c';
                petal.style.borderRadius = '50% 0 50% 50%';
                petal.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                container.appendChild(petal);
                
                // Light drifting animation
                petal.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 0.2 },
                    { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 200 + 100}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: 5000 + Math.random() * 5000,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });
            }
        });
    </script>
