<style>

<div class="flex items-center gap-6">

</nav>
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">

</div>

<!-- Main Content Canvas -->

<!-- Modal Context Helper (Micro-interaction script) -->
<script>
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // Simulate closing detail view
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.history.back();
                }, 300);
            }
            if (e.key === 'ArrowRight') {
                console.log('Next Image');
                // Trigger animation for next
            }
            if (e.key === 'ArrowLeft') {
                console.log('Previous Image');
                // Trigger animation for previous
            }
        });

        // Hover effect persistence logic for accessibility
        const mediaContainer = document.querySelector('.media-canvas');
        mediaContainer.addEventListener('mouseenter', () => {
            // Optional enhancement: Pause any auto-slide behavior
        });
    </script>
