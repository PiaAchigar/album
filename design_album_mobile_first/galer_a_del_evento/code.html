<script>
        // Simple interactive effect for gallery items
        document.querySelectorAll('.mosaic-grid > div').forEach(item => {
            item.addEventListener('click', () => {
                // Flash effect
                item.style.opacity = '0.7';
                setTimeout(() => {
                    item.style.opacity = '1';
                }, 150);
            });
        });

        // Filter button toggles
        document.querySelectorAll('.flex-shrink-0').forEach(button => {
            button.addEventListener('click', function() {
                const isActive = this.classList.contains('bg-primary-container');
                if(!isActive) {
                    this.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                    this.classList.add('bg-primary-container', 'text-on-primary-container');
                } else {
                    this.classList.remove('bg-primary-container', 'text-on-primary-container');
                    this.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                }
            });
        });
    </script>
