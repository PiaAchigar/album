<!-- Confetti Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const createConfetti = () => {
                for(let i = 0; i < 30; i++) {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'absolute';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = i % 2 === 0 ? '#fed65b' : '#ffe088';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.borderRadius = i % 3 === 0 ? '50%' : '2px';
                    confetti.style.opacity = Math.random();
                    confetti.style.zIndex = '40';
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    
                    document.body.appendChild(confetti);
                    
                    const animation = confetti.animate([
                        { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                        { transform: `translate3d(${(Math.random() - 0.5) * 200}px, 100vh, 0) rotate(${Math.random() * 1000}deg)`, opacity: 0 }
                    ], {
                        duration: Math.random() * 3000 + 2000,
                        easing: 'cubic-bezier(0, .9, .57, 1)',
                        delay: Math.random() * 500
                    });

                    animation.onfinish = () => confetti.remove();
                }
            };
            
            // Trigger confetti on load
            setTimeout(createConfetti, 500);
            
            // Subtle click effect on the button
            const btn = document.querySelector('button[onclick]');
            if(btn) {
                btn.addEventListener('click', (e) => {
                    createConfetti();
                });
            }
        });
    </script>
