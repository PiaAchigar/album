<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .media-viewer-backdrop {
            background-color: #000000;
        }
        .swipe-hint {
            animation: swipeHintAnim 2s infinite ease-in-out;
        }
        @keyframes swipeHintAnim {
            0%, 100% { transform: translateX(0); opacity: 0.3; }
            50% { transform: translateX(10px); opacity: 0.8; }
        }
        .glass-overlay {
            background: rgba(11, 28, 48, 0.6);
            backdrop-filter: blur(12px);
        }
        .action-button-active:active {
            transform: scale(0.95);
            transition: transform 0.1s ease;
        }
    </style>

<body class="bg-black text-white antialiased overflow-hidden select-none h-screen w-screen">
<!-- Top Navigation (Shell Supression applied: Detail view, using task-focused navigation) -->

<button class="flex items-center justify-center w-10 h-10 rounded-full bg-black/40 backdrop-blur-md active:scale-95 transition-all" onclick="window.history.back()">
<span class="material-symbols-outlined text-white" data-icon="close">close</span>
</button>
<div class="px-4 py-1.5 rounded-full bg-black/40 backdrop-blur-md border border-white/10">

</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-black/40 backdrop-blur-md active:scale-95 transition-all">
<span class="material-symbols-outlined text-white" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Media Canvas (Elevation: Full Screen Detail View) -->

<!-- Media Container -->

</div>
<!-- Left Swipe Visual Hint -->
<div class="absolute left-4 top-1/2 -translate-y-1/2 z-10 opacity-40">
<span class="material-symbols-outlined text-4xl" data-icon="chevron_left">chevron_left</span>
</div>
<!-- Right Swipe Visual Hint -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 z-10 swipe-hint">
<span class="material-symbols-outlined text-4xl" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Interaction Gradient Overlay -->
<div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-black/90 via-black/40 to-transparent pointer-events-none z-10"></div>
<!-- Info & Controls Container -->
<div class="absolute bottom-0 w-full z-20 px-margin-mobile pb-12 flex flex-col gap-6">
<!-- Metadata Area -->
<div class="flex flex-col gap-1">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full border-2 border-white/20 overflow-hidden bg-surface-container-highest">
<img class="w-full h-full object-cover" data-alt="A clean, professional portrait of a wedding guest, shot with a high-end camera. The subject is a smiling man in his 30s wearing a crisp navy suit. The lighting is soft and flattering, with a neutral studio background that emphasizes clarity and detail. The aesthetic is modern and professional." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAD0fvQ2O4-xGbQTGSbIvWZRpPUuNBlZ_DBQDUPJEoS4OJtZJG12XpNZ9oOffLYIbMw2iJg8RB5gKg1dFGEqiS0UMipDljEF9A2OozLlPrEaaRRqgFABJtUBzvJrY4outj5zdxvj-7BAzemRUln9juWBcHPLPgdB-mYV9eb2HkSaxjA6eaTiX-fx3IxbFU8KHxISXNchG9o4Z678sqJ9PuiAyYqf8I6HPf8seE9_q3bZHOxLKns0XlZ"/>
</div>
<div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-white">Alejandro Martí</h3>
<p class="font-label-sm text-label-sm text-white/60 uppercase tracking-widest flex items-center gap-2">
                            Hace 12 minutos
                            <span class="w-1 h-1 rounded-full bg-white/40"></span>
                            Mesa 4
                        </p>
</div>
</div>
</div>
<!-- Action Buttons (Organizer Context leaning on Professional/Bold) -->
<div class="grid grid-cols-3 gap-3">
<!-- Ocultar Button -->
<button class="flex flex-col items-center justify-center gap-2 py-4 rounded-xl glass-overlay border border-white/10 action-button-active">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10">

</div>

</button>
<!-- Eliminar Button -->
<button class="flex flex-col items-center justify-center gap-2 py-4 rounded-xl glass-overlay border border-white/10 action-button-active group">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 group-active:bg-error/20 transition-colors">
<span class="material-symbols-outlined text-error" data-icon="delete">delete</span>
</div>
<span class="font-label-sm text-label-sm text-white">Eliminar</span>
</button>
<!-- Aprobar Button (Primary Action) -->
<button class="flex flex-col items-center justify-center gap-2 py-4 rounded-xl bg-white action-button-active">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-primary-container">
<span class="material-symbols-outlined text-on-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-label-sm text-label-sm text-primary">Aprobar</span>
</button>
</div>

</main>
<!-- Haptic feedback script simulator -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });

        // Simple swipe gesture simulator for visuals
        let touchstartX = 0;
        let touchendX = 0;

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        });

        function handleGesture() {
            if (touchendX < touchstartX - 50) {
                console.log('Swiped left - next image');
                // Animation would trigger here
            }
            if (touchendX > touchstartX + 50) {
                console.log('Swiped right - previous image');
                // Animation would trigger here
            }
        }
    </script>
</body></html>
