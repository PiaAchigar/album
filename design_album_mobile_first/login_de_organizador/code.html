<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#0b1c30",
                    "outline": "#75777d",
                    "on-tertiary-fixed-variant": "#5c3d51",
                    "on-surface-variant": "#45474c",
                    "surface-container-low": "#eff4ff",
                    "primary-fixed": "#d8e3fb",
                    "on-secondary-fixed": "#241a00",
                    "background": "#f8f9ff",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#d3e4fe",
                    "outline-variant": "#c5c6cd",
                    "secondary": "#735c00",
                    "on-secondary-container": "#745c00",
                    "tertiary-fixed-dim": "#e5bad3",
                    "on-tertiary-container": "#ab859c",
                    "secondary-container": "#fed65b",
                    "primary-fixed-dim": "#bcc7de",
                    "surface-dim": "#cbdbf5",
                    "on-primary-fixed-variant": "#3c475a",
                    "inverse-primary": "#bcc7de",
                    "surface-variant": "#d3e4fe",
                    "on-tertiary": "#ffffff",
                    "surface-tint": "#545f73",
                    "inverse-surface": "#213145",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary-fixed": "#ffe088",
                    "surface-container-high": "#dce9ff",
                    "error-container": "#ffdad6",
                    "primary-container": "#1e293b",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed": "#2c1325",
                    "on-secondary-fixed-variant": "#574500",
                    "on-surface": "#0b1c30",
                    "surface-bright": "#f8f9ff",
                    "tertiary-container": "#3b2032",
                    "on-error-container": "#93000a",
                    "surface-container": "#e5eeff",
                    "surface": "#f8f9ff",
                    "secondary-fixed-dim": "#e9c349",
                    "on-primary-container": "#8590a6",
                    "tertiary": "#240b1d",
                    "on-primary": "#ffffff",
                    "on-primary-fixed": "#111c2d",
                    "tertiary-fixed": "#ffd8ed",
                    "primary": "#091426"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "stack-sm": "12px",
                    "gutter-grid": "8px",
                    "stack-md": "24px",
                    "touch-target-min": "48px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "display-festive": ["Playfair Display"],
                    "headline-lg-mobile": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "display-festive": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-sm": ["13px", {"lineHeight": "18px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar - Organizer Context (Fixed & Pro) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-touch-target-min bg-surface dark:bg-surface-container-low border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed p-2 active:scale-95 duration-150 transition-colors hover:bg-surface-container-high rounded-full" data-icon="menu">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed">Album</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-20 pb-20">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-none">
<!-- Welcome Section -->
<div class="mb-stack-md text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container mb-4">
<span class="material-symbols-outlined text-on-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">
                        admin_panel_settings
                    </span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Organizer Login</h2>
<p class="text-on-surface-variant font-body-md">Accedé a tu panel de gestión de eventos.</p>
</div>
<!-- Login Form -->
<form class="space-y-stack-md" id="login-form">
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">mail</span>
<input class="w-full h-touch-target-min pl-12 pr-4 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" id="email" name="email" placeholder="nombre@ejemplo.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full h-touch-target-min pl-12 pr-12 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline hover:text-on-surface" onclick="togglePassword()" type="button">visibility</button>
</div>
</div>
<div class="flex items-center gap-2 pt-2">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="remember" type="checkbox"/>
<label class="text-label-sm text-on-surface-variant cursor-pointer" for="remember">Mantener sesión iniciada</label>
</div>
<button class="w-full h-touch-target-min bg-primary text-on-primary font-label-sm text-label-sm rounded-lg active:scale-[0.98] transition-all hover:bg-primary/90 flex items-center justify-center gap-2" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Registration Link -->
<div class="mt-8 pt-8 border-t border-outline-variant text-center">
<p class="text-on-surface-variant font-body-md">
                    ¿No tenés cuenta? 
                    <a class="text-primary font-bold hover:underline" href="#">Registrate</a>
</p>
</div>
</div>
</main>
<!-- Illustrative Background Decor (Subtle & Pro) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden opacity-30">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-fixed blur-3xl rounded-full opacity-40"></div>
<div class="absolute top-1/2 -right-24 w-64 h-64 bg-surface-container-highest blur-3xl rounded-full opacity-50"></div>
</div>
<!-- Script for interaction -->
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const btn = event.currentTarget;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                btn.textContent = 'visibility';
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Subtle feedback for login interaction
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Cargando...</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
