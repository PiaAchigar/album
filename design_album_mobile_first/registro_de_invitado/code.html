<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar and subtle transitions */
        body { -webkit-tap-highlight-color: transparent; }
        .glass-header { backdrop-filter: blur(12px); }
        .animate-fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar - Guest Context (Filtered from JSON) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-touch-target-min bg-surface/80 backdrop-blur-md shadow-sm">
<button aria-label="Close" class="text-secondary hover:opacity-80 active:opacity-70 transition-opacity p-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-display-festive text-[24px] leading-tight text-secondary">Our Special Day</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col pt-16 pb-12 px-margin-mobile animate-fade-in">
<!-- Hero Decorative Section -->
<div class="mt-8 mb-10 text-center relative">
<div class="absolute -top-4 -left-4 opacity-10">
<span class="material-symbols-outlined text-6xl text-secondary" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<h2 class="font-display-festive text-display-festive text-on-surface mb-2">¡Bienvenido!</h2>
<p class="text-on-surface-variant font-body-md max-w-xs mx-auto">Queremos compartir cada instante contigo. Por favor, completa tus datos para el álbum digital.</p>
</div>
<!-- Error State Notification (Friendly Example) -->
<div class="mb-8 p-4 bg-error-container border border-error/20 rounded-xl flex items-start gap-3 shadow-sm" id="error-banner">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">info</span>
<div>
<p class="text-on-error-container font-bold text-label-sm">Cupo de invitados alcanzado</p>
<p class="text-on-error-container text-sm mt-0.5">Lo sentimos, la lista de invitados para este evento está completa. Contacta al organizador.</p>
</div>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-stack-md">
<!-- Name Input Group -->
<div class="flex flex-col gap-1.5">
<label class="text-label-sm text-on-surface-variant px-1 uppercase tracking-widest" for="name">Nombre</label>
<div class="relative">
<input class="w-full h-touch-target-min px-4 rounded-xl border-outline-variant bg-surface-container-lowest focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline/50" id="name" placeholder="Ej. Julian" type="text"/>
</div>
</div>
<!-- Last Name Input Group -->
<div class="flex flex-col gap-1.5">
<label class="text-label-sm text-on-surface-variant px-1 uppercase tracking-widest" for="lastname">Apellido</label>
<input class="w-full h-touch-target-min px-4 rounded-xl border-outline-variant bg-surface-container-lowest focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline/50" id="lastname" placeholder="Ej. Rodriguez" type="text"/>
</div>
<!-- Phone Input Group (Optional) -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-label-sm text-on-surface-variant uppercase tracking-widest" for="phone">Teléfono</label>
<span class="text-[11px] text-outline italic">Opcional</span>
</div>
<input class="w-full h-touch-target-min px-4 rounded-xl border-outline-variant bg-surface-container-lowest focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all placeholder:text-outline/50" id="phone" placeholder="+54 9 11 ..." type="tel"/>
</div>
<!-- T&C Checkbox -->
<div class="flex items-start gap-3 py-2">
<div class="relative flex items-center">
<input class="w-6 h-6 rounded border-outline-variant text-secondary focus:ring-secondary-container transition-all bg-surface-container-lowest" id="terms" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant leading-tight" for="terms">
                    Acepto los <a class="text-secondary font-bold hover:underline" href="#">Términos y Condiciones</a> y el uso de mis fotos en la galería del evento.
                </label>
</div>
<!-- Action Button -->
<div class="mt-4">
<button class="w-full h-touch-target-min bg-secondary text-on-secondary rounded-full font-bold shadow-[0_4px_10px_rgba(115,92,0,0.2)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Continuar
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Decorative Footer Image / Graphic -->
<div class="mt-auto pt-12 opacity-40">
<div class="w-full h-32 rounded-3xl overflow-hidden relative" data-alt="A dreamy, high-end wedding background featuring soft-focus golden champagne bubbles and delicate lace textures. The atmosphere is warm, celebratory, and elegant, with light-mode pastel colors like pale pink and cream. The lighting is ethereal and soft, creating a tactile and premium editorial aesthetic consistent with a luxury wedding app." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD3vP2xzYmgZ1gw2dRDdh9E9s5beZI3mBZ7axDExx4U1HCQ2nHJhY_y8kRjCi4BIxqci6DlrhcdXo_xNGjTcY0yu1bo7DJt0nA17OoMWrQQS5de4dJFH1dGcahrKZJK1M3StWoYcOIGbSPvyeGb-0sVuU1h9CFXH3W3Cs-rEKmqNG9vlumrF-zyiSem2N53jd5zJ3ULZljPOExXZSbZXphmKewaZJbtXHEWL4YxobDM6It5O-tDQl_b')">
<div class="absolute inset-0 bg-gradient-to-t from-surface to-transparent"></div>
</div>
</div>
</main>
<!-- Bottom Navigation suppressed as per "The Destination Rule" - this is a Task-Focused Registration Screen -->
<script>
        // Simple micro-interaction for button and input feedback
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('div').classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('div').classList.remove('scale-[1.01]');
            });
        });

        // Toggle error state visibility for demo
        setTimeout(() => {
            const error = document.getElementById('error-banner');
            error.style.transition = "opacity 0.5s ease-out";
            // error.style.opacity = "0"; // Example of how to hide it
        }, 5000);
    </script>
</body></html>
